<script>
/* =========================================================
   VIEW INDIVIDUAL EVALUATION
   UPDATED:
   Student Performance now displays the NUMBER of stars
   instead of star symbols in Class Record -> View.

   Example:
   Participation: 3 Stars
   Behavior: 4 Stars

   IMPORTANT:
   EmailJS still receives the original:
   ★★★☆☆
   ★★★★☆
   etc.
========================================================= */

function getSavedStarNumber(value){

  /*
     New saved records:
     "★★★☆☆"
     "★★★★☆"
     "★★★★★"

     Older/possible numeric records:
     3
     "3"
  */

  if(value===null || value===undefined){
    return 0;
  }

  const text=String(value).trim();

  /* If the saved value is already numeric */
  if(/^\d+(\.\d+)?$/.test(text)){
    return Math.max(
      0,
      Math.min(
        5,
        Number(text)
      )
    );
  }

  /*
     Count filled stars only.
     This correctly converts:

     ★☆☆☆☆  -> 1
     ★★☆☆☆  -> 2
     ★★★☆☆  -> 3
     ★★★★☆  -> 4
     ★★★★★  -> 5
  */

  const filledStars=
    (text.match(/★/g)||[]).length;

  return Math.max(
    0,
    Math.min(
      5,
      filledStars
    )
  );

}


function viewEvaluationRecord(studentId,index){

  const student=
  getStudents().find(
    s=>String(s.id)===String(studentId)
  );

  if(!student)
  return;

  const records=
  getStudentEvaluations(student.id);

  records[Number(index)];

  return;

  const container=
  document.getElementById(
    'evaluationViewContent'
  );

  /*
     IMPORTANT:
     Do NOT change the value sent to parents.

     The saved evaluation contains values such as:
     ★★★☆☆

     We only convert them to numbers for the
     Class Record -> View display.
  */

  const participationStars=
    getSavedStarNumber(
      evaluation.participation
    );

    getSavedStarNumber(

    getSavedStarNumber(

      evaluation.speaking

  const understandingStars=

      evaluation.understanding
    );

  const listeningStars=
    getSavedStarNumber(
      evaluation.listening
    );

  evaluation.lesson_topic ||
  'N/A';

  const dateTime=
  evaluation.dateTime ||
  evaluation.createdAt ||
  '';

  container.innerHTML=`

  <div class="record-detail-header">

  ${getStudentAvatarHtml(

  <div>

  <div class="record-detail-section">

  <div class="record-detail-grid">

  </div>

  <div class="record-detail-box">

  <label>Date & Time</label>

  ${escapeHtml(
    formatDateTime(dateTime)
  )}
  </div>

  </div>

  <div class="record-detail-box">

  <label>Class Duration</label>

  <div>
  ${escapeHtml(
    evaluation.duration ||
    'N/A'
  )}
  </div>

  </div>

  <div class="record-detail-box">

  <label>Teacher</label>

  <div>
  ${escapeHtml(
    evaluation.teacher ||
    'Teacher Danyeal'

  </div>

  </div>

  <div class="record-detail-box">

  <label>Overall Score</label>

  <div>
  ${escapeHtml(
    evaluation.score ||
    'N/A'
  )}
  </div>

  </div>

  <div class="record-detail-box">

  <label>Rating</label>

  </div>

  </div>


  <div class="record-detail-section">
